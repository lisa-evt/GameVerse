{% extends 'base.html' %}
{% load static %}

{% block title %}Password Changed — gameVerse{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="gv-auth-page">
  <div class="gv-auth-card text-center">
    <div class="gv-auth-icon"><i class="bi bi-check-circle"></i></div>
    <h1 class="gv-auth-title">Password Changed</h1>
    <p class="gv-auth-subtitle">You can now log in with your new password</p>
    <a href="{% url 'login' %}" class="btn gv-btn-primary">Log In</a>
  </div>
</div>
{% endblock %}
