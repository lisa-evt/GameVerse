{% extends 'catalog/list_grid.html' %}

{% block page_title %}Characters — gameVerse{% endblock %}
{% block empty_text %}No characters yet.{% endblock %}

{% block card_body %}
<div class="card-body">
  <a href="{% url 'catalog:character_detail' item.slug %}" class="text-decoration-none">
    <h5 class="card-title">{{ item.name }}</h5>
  </a>
  <p class="card-text text-muted">{{ item.game }}</p>
</div>
{% endblock %}
