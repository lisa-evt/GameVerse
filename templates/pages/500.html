<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ошибка сервера — gameVerse</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d14;
      color: #f0f0f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.25rem;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 18px;
      padding: 2.75rem 2.25rem;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
    }
    .icon { font-size: 2.5rem; margin-bottom: 1rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 0.4rem; color: #fff; }
    p { font-size: 0.9rem; color: rgba(240, 240, 245, 0.6); line-height: 1.5; margin: 0 0 2rem; }
    a.btn {
      display: block;
      padding: 0.7rem;
      border-radius: 8px;
      background: linear-gradient(135deg, #8a7bff, #5f4bff);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">&#9888;&#65039;</div>
    <h1>Что-то сломалось на сервере</h1>
    <p>Мы уже разбираемся (или скоро узнаем) — попробуй обновить страницу через пару минут.</p>
    <a class="btn" href="/">Вернуться на главную</a>
  </div>
</body>
</html>
