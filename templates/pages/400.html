{% extends 'base.html' %}
{% load static %}

{% block title %}Некорректный запрос — gameVerse{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="gv-auth-page">
  <div class="gv-auth-card text-center">
    <div class="gv-auth-icon"><i class="bi bi-exclamation-circle"></i></div>
    <h1 class="gv-auth-title">Некорректный запрос</h1>
    <p class="gv-auth-subtitle">
      Сервер не смог обработать запрос — возможно, в адресе ошибка.
    </p>
    <a href="/" class="btn gv-btn-primary">Вернуться на главную</a>
  </div>
</div>
{% endblock %}
