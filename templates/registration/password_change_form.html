{% extends 'base.html' %}
{% load static %}
{% load django_bootstrap5 %}

{% block title %}Password change — gameVerse{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/auth.css' %}">
{% endblock %}

{% block content %}
<div class="gv-auth-page">
  <div class="gv-auth-card">
    <h1 class="gv-auth-title">Change password</h1>

    <form method="post">
      {% csrf_token %}
      {% bootstrap_form form %}
      <button type="submit" class="btn gv-btn-primary">Save</button>
    </form>
  </div>
</div>
{% endblock %}
